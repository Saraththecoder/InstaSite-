<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF7ED" />
      <stop offset="100%" stop-color="#FFEDD5" />
    </linearGradient>
    <linearGradient id="dishGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#7C2D12" flood-opacity="0.15" />
    </filter>
  </defs>
  
  <!-- Background Card -->
  <rect width="400" height="300" rx="16" fill="url(#bgGrad)" />
  
  <!-- Decorative circles -->
  <circle cx="200" cy="140" r="90" fill="#FED7AA" opacity="0.4" />
  <circle cx="200" cy="140" r="75" fill="#FFFFFF" filter="url(#shadow)" />
  <circle cx="200" cy="140" r="65" fill="#FFF7ED" stroke="#FDBA74" stroke-width="2" stroke-dasharray="4 4" />
  
  <!-- Food / Cloche Icon -->
  <g transform="translate(160, 95) scale(0.8)">
    <!-- Base Plate -->
    <path d="M 10 75 Q 50 85 90 75 L 95 80 Q 50 92 5 80 Z" fill="#9A3412" />
    <!-- Cloche dome -->
    <path d="M 15 70 C 15 30, 85 30, 85 70 Z" fill="url(#dishGrad)" />
    <!-- Knob -->
    <circle cx="50" cy="25" r="7" fill="#C2410C" />
    <path d="M 47 25 Q 50 20 53 25" stroke="#FFF" stroke-width="2" stroke-linecap="round" fill="none" />
    <!-- Highlight shine -->
    <path d="M 28 60 C 28 42, 45 35, 55 35" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.6" fill="none" />
    <!-- Steam waves -->
    <path d="M 38 15 Q 35 10 38 5" stroke="#F97316" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7" />
    <path d="M 50 12 Q 53 7 50 2" stroke="#F97316" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7" />
    <path d="M 62 15 Q 59 10 62 5" stroke="#F97316" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7" />
  </g>

  <!-- Tagline / Label -->
  <text x="200" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#9A3412" text-anchor="middle" letter-spacing="0.5">
    FRESH &amp; DELICIOUS
  </text>
  <text x="200" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#EA580C" text-anchor="middle" opacity="0.8">
    Authentic Flavor
  </text>
</svg>
