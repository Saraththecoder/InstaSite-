services:
  - type: web
    name: dukaanmitra-ai
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python run_all.py
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: WHISPER_MODEL_SIZE
        value: tiny
      - key: GEMINI_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: STORE_BASE_URL
        sync: false
